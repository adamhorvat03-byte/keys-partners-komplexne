[build]
  publish = "."

# Proxy rewrite pre divíziu Reality na samostatný projekt Keys Partners
[[redirects]]
  from = "/reality/*"
  to = "https://keyspartner.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/reality"
  to = "https://keyspartner.netlify.app/"
  status = 200
  force = true

# Čisté URL trasy pre Development a Property Management
[[redirects]]
  from = "/development"
  to = "/development/index.html"
  status = 200

[[redirects]]
  from = "/management"
  to = "/management/index.html"
  status = 200

[[redirects]]
  from = "/developing"
  to = "/development/index.html"
  status = 200

[[redirects]]
  from = "/inziniering"
  to = "/management/index.html"
  status = 200

# Bezpečnostné a výkonnostné HTTP hlavičky
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
