  <!-- Reusable SVG Linear Gradient for Icons -->
  <svg width="0" height="0" class="visually-hidden">
    <defs>
      <linearGradient id="goldGradientIcon" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF2CE" />
        <stop offset="45%" stop-color="#D4AF37" />
        <stop offset="100%" stop-color="#A27D26" />
      </linearGradient>
    </defs>
  </svg>

  <!-- Graceful Navigation Script (supports both web server root paths and local file browsing) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If page is opened directly as file:// or without URL rewrite server,
      // adapt href links so local preview works seamlessly.
      const isFileProtocol = window.location.protocol === 'file:';
      if (isFileProtocol) {
        document.querySelectorAll('a[data-subpage]').forEach(link => {
          const subpage = link.getAttribute('data-subpage');
          link.setAttribute('href', `./${subpage}.html`);
        });
      }

      // Interactive subtle hover sound or magnetic tilt effect (optional enhancement)
      const bubbles = document.querySelectorAll('.bubble-card');
      bubbles.forEach(bubble => {
        bubble.addEventListener('mousemove', (e) => {
          const rect = bubble.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          bubble.style.transform = `translate3d(${x * 0.08}px, ${y * 0.08}px, 0) scale(1.04)`;
        });

        bubble.addEventListener('mouseleave', () => {
          bubble.style.transform = '';
        });
      });
    });
  </script>
